name: Deploy Report to GitHub Pages

on:
  push:
    branches: [main, developer-1]
    paths:
      - 'reports/*/cbond_overview.html'
      - 'reports/*/cbond_overview.md'
      - 'reports/*/index.html'
      - 'reports/index.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Reports are pre-rendered locally by auto_daily.sh with the full
      # backtest equity-curve baked in. We deliberately do NOT re-render
      # from .md here, because backtest_weekly.json lives under data/ which
      # is gitignored — re-rendering would drop the chart.

      - name: Assemble _site
        run: |
          mkdir -p _site
          for dir in $(ls -d reports/????-??-??/ 2>/dev/null | sort -r); do
            date=$(basename "$dir")
            source="$dir/cbond_overview.html"
            [ -f "$source" ] || source="$dir/index.html"
            [ -f "$source" ] || continue
            mkdir -p "_site/$date"
            cp "$source" "_site/$date/index.html"
          done

      - name: Inject date dropdown + homepage redirect
        run: |
          python3 <<'PY'
          import os, re, glob, html

          dates = sorted(
              [os.path.basename(os.path.dirname(p)) for p in glob.glob("_site/*/index.html")],
              reverse=True,
          )
          if not dates:
              print("no reports rendered, nothing to inject")
              raise SystemExit(0)

          latest = dates[0]

          # /latest/ stable URL = copy of newest report
          os.makedirs("_site/latest", exist_ok=True)
          with open(f"_site/{latest}/index.html", "rb") as f:
              latest_html = f.read()
          with open("_site/latest/index.html", "wb") as f:
              f.write(latest_html)

          # Homepage = redirect to /latest/
          with open("_site/index.html", "w", encoding="utf-8") as f:
              f.write(
                  '<!doctype html><meta charset="utf-8">'
                  '<meta http-equiv="refresh" content="0;url=latest/">'
                  '<title>可转债报告</title>'
                  '<a href="latest/">前往最新一期</a>'
              )

          # Inject dropdown into every /<date>/index.html (and /latest/index.html).
          # The current hero-date line is:
          #   <p class="hero-date">数据截至 YYYY-MM-DD</p>
          targets = [f"_site/{d}/index.html" for d in dates] + ["_site/latest/index.html"]
          pat = re.compile(
              r'<p class="hero-date">数据截至\s*([0-9]{4}-[0-9]{2}-[0-9]{2})</p>'
          )

          def build_select(current):
              # current may be the literal date or "latest"
              opts = []
              for d in dates:
                  label = f"{d}（最新）" if d == latest else d
                  selected = " selected" if d == current or (current == "latest" and d == latest) else ""
                  opts.append(
                      f'<option value="{d}"{selected}>{html.escape(label)}</option>'
                  )
              # On change: navigate sibling directory. Both /latest/ and /<date>/
              # are one level deep, so "../<picked>/" works in both cases.
              return (
                  '<p class="hero-date">数据截至 '
                  '<select onchange="if(this.value)location.href=\'../\'+this.value+\'/\';" '
                  'style="background:rgba(255,255,255,0.06);color:inherit;'
                  'border:1px solid rgba(255,255,255,0.2);border-radius:6px;'
                  'padding:2px 10px;font:inherit;cursor:pointer;margin-left:4px;">'
                  + "".join(opts)
                  + '</select></p>'
              )

          for path in targets:
              if not os.path.exists(path):
                  continue
              with open(path, "r", encoding="utf-8") as f:
                  src = f.read()
              # Figure out which date this page corresponds to
              parent = os.path.basename(os.path.dirname(path))
              current = parent  # either "latest" or YYYY-MM-DD
              replacement = build_select(current)
              new_src, n = pat.subn(replacement, src, count=1)
              if n == 0:
                  print(f"[warn] hero-date pattern not found in {path}")
                  continue
              with open(path, "w", encoding="utf-8") as f:
                  f.write(new_src)
              print(f"[inject] {path} ({len(dates)} dates)")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
